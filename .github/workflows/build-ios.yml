# Hamo Tunnel iOS Build Workflow
# Fully automated: creates Extension target, downloads libxray + hev-socks5-tunnel,
# builds unsigned .ipa for TrollStore (no Apple Developer account needed)
# Runs on macOS GitHub Actions runner

name: Build iOS (Unsigned for TrollStore)

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.24.3'
        type: string

env:
  FLUTTER_VERSION: ${{ github.event.inputs.flutter_version || '3.24.3' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
  PROJECT_NAME: 'hamo_tunnel'
  BUNDLE_ID: 'com.hamo.hamo_tunnel'
  EXTENSION_BUNDLE_ID: 'com.hamo.hamo_tunnel.HamoTunnelExtension'
  APP_GROUP: 'group.com.hamo.hamo_tunnel.shared'
  LIBXRAY_VERSION: 'v26.10.31'
  LIBXRAY_URL: 'https://github.com/XTLS/libXray/releases/download/v26.10.31/libxray-apple-cgo.zip'
  OUTPUT_DIR: 'build/ios/ipa'

jobs:
  setup:
    name: Setup & Validate
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      flutter_version: ${{ steps.flutter.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        id: flutter
        run: |
          flutter --version
          echo "version=$(flutter --version | head -1 | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Verify iOS project structure
        run: |
          ls -la ios/
          ls -la ios/Runner.xcodeproj/
          test -f ios/Runner/Info.plist && echo "Info.plist exists" || echo "ERROR: Info.plist missing"

  download_dependencies:
    name: Download Native Dependencies
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Create Frameworks directory
        run: mkdir -p ios/Frameworks

      - name: Download libXray (LibXray.xcframework)
        run: |
          cd ios/Frameworks
          echo "Downloading libXray ${LIBXRAY_VERSION}..."
          # Release asset lives in XTLS/libXray (NOT XTLS/Xray-core); -f makes
          # a 404 fail the step instead of unzipping an HTML/plain-text body.
          curl -fsSL -o libxray-apple-cgo.zip "${LIBXRAY_URL}"
          unzip -q libxray-apple-cgo.zip
          rm libxray-apple-cgo.zip
          # Zip contains libxray-apple-cgo/LibXray.xcframework
          mv libxray-apple-cgo/LibXray.xcframework .
          rm -rf libxray-apple-cgo
          ls -la LibXray.xcframework

      - name: Download hev-socks5-tunnel (TUN2SOCKS bridge)
        run: |
          cd ios/Frameworks
          echo "Downloading hev-socks5-tunnel..."
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel
          cd hev-socks5-tunnel
          ./build-apple.sh
          # build-apple.sh produces HevSocks5Tunnel.xcframework in build/
          XCF=$(find . -name "HevSocks5Tunnel.xcframework" -type d | head -1)
          test -n "$XCF"
          cp -R "$XCF" ../
          ls -R ../HevSocks5Tunnel.xcframework | head -50

      - name: Verify dependencies

        run: |
          cd ios/Frameworks
          echo "=== libXray ==="
          file LibXray.xcframework/ios-arm64/libXray.a
          echo "=== hev-socks5-tunnel ==="
          ls -la HevSocks5Tunnel.xcframework
          find HevSocks5Tunnel.xcframework -type f -name "*.h" | head -10
          find HevSocks5Tunnel.xcframework -type f -name "*.a" | head -5

      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-dependencies
          path: |
            ios/Frameworks/LibXray.xcframework
            ios/Frameworks/HevSocks5Tunnel.xcframework
          retention-days: 7

  build_ios:
    name: Build Unsigned iOS App + Extension
    needs: [setup]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native dependencies
        uses: actions/download-artifact@v4
        with:
          name: native-dependencies
          path: ios/Frameworks

      # The extension target is generated here (not in a separate job) because
      # each job gets a fresh checkout: pbxproj edits made in another job would
      # be lost.
      - name: Verify extension source files exist
        run: |
          ls -la ios/HamoTunnelExtension/
          test -f ios/HamoTunnelExtension/PacketTunnelProvider.swift && echo "PacketTunnelProvider.swift OK"
          test -f ios/HamoTunnelExtension/Tun2SocksBridge.h && echo "Tun2SocksBridge.h OK"
          test -f ios/HamoTunnelExtension/Info.plist && echo "Info.plist OK"
          test -f ios/HamoTunnelExtension/HamoTunnelExtension.entitlements && echo "Entitlements OK"

      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Run automated extension target setup
        run: |
          chmod +x ios/setup_extension_target_ci.sh
          ./ios/setup_extension_target_ci.sh

      - name: Verify target was created
        run: |
          xcodebuild -project ios/Runner.xcodeproj -list | grep -A 20 "Targets:"
          xcodebuild -project ios/Runner.xcodeproj -target HamoTunnelExtension -showBuildSettings | grep -E "(PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|SWIFT_OBJC_BRIDGING_HEADER|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS)"

      - name: Show extension product settings (diagnostic)
        run: |
          xcodebuild -project ios/Runner.xcodeproj -target HamoTunnelExtension -configuration Release -showBuildSettings | grep -E "^ *(PRODUCT_NAME|FULL_PRODUCT_NAME|WRAPPER_NAME|PRODUCT_BUNDLE_IDENTIFIER|TARGET_BUILD_DIR) ="
          echo -n "Embed App Extensions phases: "
          grep -c "Embed App Extensions" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Flutter iOS framework (Release, no codesign)
        id: flutter_build
        run: |
          flutter build ios \
            --${{ env.BUILD_TYPE }} \
            --no-codesign \
            --build-name=3.2.0 \
            --build-number=32

      - name: Collect all Xcode compile/link errors (diagnostic)
        if: failure() && steps.flutter_build.outcome == 'failure'
        continue-on-error: true
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*undefined|ld:" | sort -u

      - name: Build Extension target with xcodebuild (no codesign)
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            OTHER_CODE_SIGN_FLAGS="--deep" \
            2>&1 | tail -50

      - name: Locate built .app and .appex
        run: |
          APP_PATH=$(find ios/build -name "Runner.app" -type d -not -path "*/PlugIns/*" | head -1)
          # Prefer the standalone extension product (Build/Products/...), then
          # fall back to the copy embedded in Runner.app/PlugIns by the
          # "Embed App Extensions" build phase.
          EXT_PATH=$(find ios/build -name "HamoTunnelExtension.appex" -type d -not -path "*/Runner.app/PlugIns/*" | head -1)
          if [ -z "$EXT_PATH" ]; then
            EXT_PATH=$(find ios/build -name "HamoTunnelExtension.appex" -type d | head -1)
          fi

          if [ -n "$APP_PATH" ] && [ ! -d "$APP_PATH/PlugIns/HamoTunnelExtension.appex" ]; then
            echo "WARNING: Runner.app does not embed HamoTunnelExtension.appex (embed phase did not run)"
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find ios/build -name "*.app" -type d
            exit 1
          fi

          if [ -z "$EXT_PATH" ] || [ ! -d "$EXT_PATH" ]; then
            echo "ERROR: HamoTunnelExtension.appex not found"
            find ios/build -name "*.appex" -type d
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "EXT_PATH=$EXT_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"
          echo "Found extension at: $EXT_PATH"

      - name: Verify .app bundle structure
        run: |
          echo "=== App Bundle Structure ==="
          ls -la "${{ env.APP_PATH }}/"
          echo "=== Extension Bundle Structure ==="
          ls -la "${{ env.EXT_PATH }}/"

      - name: Verify no code signatures (unsigned build)
        run: |
          echo "Checking build products for code signatures (diagnostic; packaging removes them)..."
          FOUND="$(find "${{ env.APP_PATH }}" "${{ env.EXT_PATH }}" \
            \( -name _CodeSignature -o -name embedded.mobileprovision \) \
            -print 2>/dev/null | sort -u || true)"
          if [ -n "$FOUND" ]; then
            echo "WARNING: Build products contain signature artifacts; packaging will remove:"
            echo "$FOUND"
          else
            echo "OK: No signature artifacts found in build products"
          fi

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail

          rm -rf Payload
          mkdir -p Payload
          cp -R "${{ env.APP_PATH }}" Payload/

          # Ensure the extension inside the app is the freshly built product.
          rm -rf Payload/Runner.app/PlugIns/HamoTunnelExtension.appex
          mkdir -p Payload/Runner.app/PlugIns
          cp -R "${{ env.EXT_PATH }}" Payload/Runner.app/PlugIns/

          # Strip Mach-O code signatures first, while bundle signature metadata
          # is still present. codesign ships with Xcode on the macOS runners;
          # only attempt removal for binaries codesign reports as signed.
          if command -v codesign >/dev/null 2>&1; then
            find Payload -type f -print0 | while IFS= read -r -d '' binary; do
              if file "$binary" | grep -q 'Mach-O' && codesign -d "$binary" >/dev/null 2>&1; then
                if codesign --remove-signature "$binary" >/dev/null 2>&1; then
                  echo "Removed embedded signature: $binary"
                else
                  echo "WARNING: could not remove embedded signature: $binary"
                fi
              fi
            done
          else
            echo "WARNING: codesign not found; leaving embedded Mach-O signatures untouched"
          fi

          # Remove every signature artifact, including frameworks and PlugIns.
          find Payload -name _CodeSignature -type d -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete

          # Do not package if any signature artifacts survived cleanup.
          REMAINING="$(find Payload \( -name _CodeSignature -o -name embedded.mobileprovision \) -print -quit || true)"
          if [ -n "$REMAINING" ]; then
            echo "ERROR: signature artifacts remain after cleanup:"
            find Payload \( -name _CodeSignature -o -name embedded.mobileprovision \) -print
            exit 1
          fi

          # Zip from the workspace root so entries are Payload/Runner.app/...,
          # which is required for a valid .ipa.
          IPA_NAME="${{ env.PROJECT_NAME }}_unsigned_${{ env.BUILD_TYPE }}_${{ github.run_number }}.ipa"
          rm -f "$IPA_NAME"
          zip -r -q "$IPA_NAME" Payload
          echo "IPA_PATH=${{ github.workspace }}/$IPA_NAME" >> "$GITHUB_ENV"

      - name: Verify unsigned .ipa
        run: |
          set -euo pipefail
          IPA="${{ env.IPA_PATH }}"
          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA not found: $IPA"
            exit 1
          fi
          echo "Verifying IPA: $IPA"
          unzip -Z1 "$IPA" | grep -E '(^Payload/Runner\.app/|HamoTunnelExtension\.appex|Info\.plist$)' | head -20 || true

          SIGNATURE_ARTIFACTS="$(unzip -Z1 "$IPA" | grep -iE '(_CodeSignature(/|$)|embedded\.mobileprovision$)' || true)"
          if [ -n "$SIGNATURE_ARTIFACTS" ]; then
            echo "ERROR: Found signature artifacts in the IPA:"
            echo "$SIGNATURE_ARTIFACTS"
            exit 1
          fi
          echo "OK: No signature artifacts found"

          for required in \
            "Payload/Runner.app/Info.plist" \
            "Payload/Runner.app/PlugIns/HamoTunnelExtension.appex/Info.plist"; do
            if ! unzip -Z1 "$IPA" | grep -Fqx "$required"; then
              echo "ERROR: Required IPA entry missing: $required"
              exit 1
            fi
          done

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -p "$IPA" "Payload/Runner.app/Info.plist" > "$TMP_DIR/Runner-Info.plist"
          unzip -p "$IPA" "Payload/Runner.app/PlugIns/HamoTunnelExtension.appex/Info.plist" > "$TMP_DIR/Extension-Info.plist"

          RUNNER_ID="$(plutil -extract CFBundleIdentifier raw -o - "$TMP_DIR/Runner-Info.plist")"
          EXT_ID="$(plutil -extract CFBundleIdentifier raw -o - "$TMP_DIR/Extension-Info.plist")"
          echo "Runner CFBundleIdentifier: $RUNNER_ID"
          echo "Extension CFBundleIdentifier: $EXT_ID"
          if [ "$RUNNER_ID" != "${{ env.BUNDLE_ID }}" ]; then
            echo "ERROR: Runner CFBundleIdentifier mismatch"
            exit 1
          fi
          if [ "$EXT_ID" != "${{ env.EXTENSION_BUNDLE_ID }}" ]; then
            echo "ERROR: Extension CFBundleIdentifier mismatch"
            exit 1
          fi

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-unsigned-ipa-${{ env.BUILD_TYPE }}
          path: ${{ env.IPA_PATH }}
          retention-days: 30

  trollstore_sign:
    name: TrollStore ldid Sign
    needs: [build_ios]
    runs-on: macos-15
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download unsigned .ipa
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-unsigned-ipa-${{ env.BUILD_TYPE }}
          path: artifacts/

      - name: Install ldid
        run: |
          brew install ldid || true
          command -v ldid
          ls -la "$(command -v ldid)"

      - name: Extract .ipa for signing
        run: |
          set -euo pipefail
          cd artifacts
          IPA_FILE="$(find . -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No unsigned IPA found in artifacts/"
            exit 1
          fi
          rm -rf Payload
          unzip -q "$IPA_FILE"
          if [ ! -d Payload/Runner.app ]; then
            echo "ERROR: Payload/Runner.app missing after extracting $IPA_FILE"
            exit 1
          fi
          if [ ! -d Payload/Runner.app/PlugIns/HamoTunnelExtension.appex ]; then
            echo "ERROR: embedded extension missing after extracting $IPA_FILE"
            exit 1
          fi
          ls -la Payload/Runner.app/
          ls -la Payload/Runner.app/PlugIns/HamoTunnelExtension.appex/

      - name: Create entitlements for main app
        run: |
          cat > entitlements_app.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>com.apple.developer.networking.vpn.api</key>
              <array>
                  <string>allow-vpn</string>
              </array>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>${{ env.APP_GROUP }}</string>
              </array>
              <key>keychain-access-groups</key>
              <array>
                  <string>${{ env.BUNDLE_ID }}.shared</string>
              </array>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>${{ env.BUNDLE_ID }}</string>
          </dict>
          </plist>
          PLIST
          cat entitlements_app.plist

      - name: Create entitlements for extension
        run: |
          cat > entitlements_ext.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>com.apple.developer.networking.vpn.api</key>
              <array>
                  <string>allow-vpn</string>
              </array>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>${{ env.APP_GROUP }}</string>
              </array>
              <key>keychain-access-groups</key>
              <array>
                  <string>${{ env.BUNDLE_ID }}.shared</string>
              </array>
              <key>get-task-allow</key>
              <true/>
              <key>application-identifier</key>
              <string>${{ env.EXTENSION_BUNDLE_ID }}</string>
          </dict>
          </plist>
          PLIST
          cat entitlements_ext.plist

      - name: Sign with ldid (TrollStore compatible)
        run: |
          set -euo pipefail
          cd artifacts
          APP="Payload/Runner.app"
          EXT="$APP/PlugIns/HamoTunnelExtension.appex"
          ENT_APP="$GITHUB_WORKSPACE/entitlements_app.plist"
          ENT_EXT="$GITHUB_WORKSPACE/entitlements_ext.plist"

          for entitlements in "$ENT_APP" "$ENT_EXT"; do
            if [ ! -f "$entitlements" ]; then
              echo "ERROR: entitlements file not found: $entitlements"
              exit 1
            fi
          done

          sign_macho_tree() {
            local root="$1"
            local entitlements="$2"
            local binary
            find "$root" -type f -print0 | while IFS= read -r -d '' binary; do
              if file "$binary" | grep -q 'Mach-O'; then
                echo "Signing $binary"
                if ! ldid -S"$entitlements" "$binary"; then
                  echo "ERROR: ldid failed for $binary"
                  exit 1
                fi
              fi
            done
          }

          # Sign nested Mach-O binaries first. Signing a .framework directory
          # with ldid does not sign the binary inside the framework.
          if [ -d "$APP/Frameworks" ]; then
            sign_macho_tree "$APP/Frameworks" "$ENT_APP"
          fi
          if [ -d "$EXT/Frameworks" ]; then
            sign_macho_tree "$EXT/Frameworks" "$ENT_EXT"
          fi

          # Sign the extension executable with extension entitlements.
          if [ ! -f "$EXT/HamoTunnelExtension" ]; then
            echo "ERROR: extension executable not found: $EXT/HamoTunnelExtension"
            exit 1
          fi
          echo "Signing extension executable: $EXT/HamoTunnelExtension"
          ldid -S"$ENT_EXT" "$EXT/HamoTunnelExtension"

          # Sign the main app executable last with app entitlements.
          if [ ! -f "$APP/Runner" ]; then
            echo "ERROR: main executable not found: $APP/Runner"
            exit 1
          fi
          echo "Signing main executable: $APP/Runner"
          ldid -S"$ENT_APP" "$APP/Runner"

          echo "ldid signing complete"

      - name: Re-package signed .ipa
        run: |
          cd artifacts
          zip -r -q ${{ env.PROJECT_NAME }}_trollstore_${{ github.ref_name }}.ipa Payload/
          echo "Signed IPA created"

      - name: Verify ldid signatures
        run: |
          set -euo pipefail
          cd artifacts
          echo "=== Main app signature ==="
          ldid -e Payload/Runner.app/Runner
          echo "=== Extension signature ==="
          ldid -e Payload/Runner.app/PlugIns/HamoTunnelExtension.appex/HamoTunnelExtension
          echo "=== Flutter framework signature ==="
          ldid -e Payload/Runner.app/Frameworks/Flutter.framework/Flutter
          echo "=== App framework signature ==="
          ldid -e Payload/Runner.app/Frameworks/App.framework/App
          ls -la ${{ env.PROJECT_NAME }}_trollstore_${{ github.ref_name }}.ipa

      - name: Upload TrollStore signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-trollstore-ipa-${{ github.ref_name }}
          path: artifacts/${{ env.PROJECT_NAME }}_trollstore_${{ github.ref_name }}.ipa
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [build_ios, trollstore_sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download unsigned .ipa
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-unsigned-ipa-${{ env.BUILD_TYPE }}
          path: release/unsigned

      - name: Download TrollStore signed .ipa
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-trollstore-ipa-${{ github.ref_name }}
          path: release/trollstore

      - name: Prepare release notes
        run: |
          echo '' | base64 -d > release_notes.md
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hamo Tunnel ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/unsigned/*.ipa
            release/trollstore/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Completion
    needs: [build_ios, trollstore_sign, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "=== Build Summary ==="
          echo "Flutter Version: ${{ needs.setup.outputs.flutter_version }}"
          echo "Build Type: ${{ env.BUILD_TYPE }}"
          echo "Build Number: ${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo ""
          echo "Artifacts:"
          echo "  - Unsigned .ipa: uploaded"
          if [ "${{ needs.trollstore_sign.result }}" == "success" ]; then
            echo "  - TrollStore signed .ipa: uploaded"
            echo "  - GitHub Release: created"
          else
            echo "  - TrollStore signing: skipped/failed"
          fi