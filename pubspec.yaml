name: hamo_tunnel
description: "Hamo Tunnel - VPN Client for iOS"
publish_to: 'none'

version: 3.2.0+32

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Network & HTTP
  http: ^1.2.2
  dio: ^5.4.3+1

  # JSON serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Permission handling
  permission_handler: ^11.3.1

  # Network info
  network_info_plus: ^6.0.1

  # Device info
  device_info_plus: ^11.1.1

  # Package info
  package_info_plus: ^8.1.0

  # URL launcher
  url_launcher: ^6.2.6

  # Clipboard
  clipboard: ^0.1.3

  # Logging
  logger: ^2.4.0

  # Crypto for config decryption
  cryptography: ^2.7.0
  pointycastle: ^3.8.0

  # Background tasks
  workmanager: ^0.5.2

  # Connectivity
  connectivity_plus: ^6.0.5

  # Vibration feedback
  vibration: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/config/